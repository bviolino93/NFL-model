name: Log NFL lines

# Snapshots game lines and player props from The Odds API and commits the
# CSVs under data/lines/. Needs a repository secret ODDS_API_KEY
# (Settings -> Secrets and variables -> Actions). Without it the job fails
# fast and costs nothing.
#
# Tuesday afternoon is close to the opener for most books; Sunday 15:00 UTC
# is two hours before the early kickoffs, close to the close.

on:
  schedule:
    - cron: "0 18 * 9-12,1-2 2"   # Tuesday 18:00 UTC, Sep-Feb
    - cron: "0 15 * 9-12,1-2 0"   # Sunday 15:00 UTC, Sep-Feb
  workflow_dispatch:

permissions:
  contents: write

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Snapshot
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python log_lines.py --out-dir data/lines
      - name: Commit
        run: |
          git config user.name "line-logger"
          git config user.email "line-logger@users.noreply.github.com"
          git add data/lines
          git diff --cached --quiet || git commit -m "Line snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
