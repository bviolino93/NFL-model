name: Research

# Runs the opener study (opener_research.py), which needs historical
# opening lines the sandbox can't download. Results go to the job log;
# the downloaded odds file is never committed.

on:
  push:
    paths:
      - opener_research.py
      - .github/workflows/research.yml
  workflow_dispatch:

jobs:
  openers:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache nflverse
        uses: actions/cache@v4
        with:
          path: .cache_nflverse
          key: nflverse-research-${{ github.run_id }}
          restore-keys: nflverse-research-
      - run: pip install pandas numpy pyarrow requests openpyxl
      - name: Download historical lines
        run: |
          curl -sSfL -A "Mozilla/5.0" -o /tmp/nfl.xlsx \
            https://www.aussportsbetting.com/historical_data/nfl.xlsx
          ls -l /tmp/nfl.xlsx
      - run: python opener_research.py /tmp/nfl.xlsx
