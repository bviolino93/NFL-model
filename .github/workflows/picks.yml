name: Picks

# Runs the pick engine (picks.py) against live odds and publishes the result
# a few ways:
#   * the run's summary page (Actions tab -> latest "Picks" run)
#   * the `picks` branch: README.md renders on github.com on any phone,
#     https://github.com/bviolino93/NFL-model/tree/picks
#   * the dashboard on GitHub Pages, once enabled (Settings -> Pages ->
#     Source: GitHub Actions): https://bviolino93.github.io/NFL-model/
#
# history.json on the picks branch keeps every bet and grades it from
# nflverse final scores; each run reads it back and adds to it.
#
# Needs repository secret ODDS_API_KEY. Optional repository variable
# MY_BOOKS to change which books bets are placed at (default
# "draftkings,fanduel"; every book still informs the fair line).
# Each run costs ~6 Odds API credits (us + eu regions, 3 markets).
#
# College football (cfb_picks.py) runs on its own schedule below plus the
# Thursday run, publishing to /cfb/ on the same site with its own
# history in cfb/history.json; ~4 credits a run (us + eu, 2 markets).

on:
  schedule:
    - cron: "0 15 * 9-12,1-2 0"    # Sunday 15:00 UTC, before the early games
    - cron: "0 19 * 9-12,1-2 4"    # Thursday 19:00 UTC
    - cron: "0 20 * 9-12,1-2 1"    # Monday 20:00 UTC
    # College only: Sunday evening when next Saturday's lines go up,
    # Tuesday, and Saturday morning before the noon games.
    - cron: "0 22 * 8-12,1 0"
    - cron: "0 20 * 8-12,1 2"
    - cron: "0 15 * 8-12,1 6"
  workflow_dispatch:
    inputs:
      league:
        description: "Which picks to run"
        type: choice
        options: [both, nfl, cfb]
        default: both
      bankroll:
        description: "Bankroll for stake sizing"
        default: "1000"
      test_alert:
        description: "Send an alert even if no bets are new"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: picks
  cancel-in-progress: false

jobs:
  picks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache nflverse
        uses: actions/cache@v4
        with:
          path: .cache_nflverse
          key: nflverse-picks-${{ github.run_id }}
          restore-keys: nflverse-picks-
      - name: Cache college data
        uses: actions/cache@v4
        with:
          path: .cache_cfb
          key: cfb-${{ github.run_id }}
          restore-keys: cfb-
      - run: pip install pandas numpy pyarrow requests scipy scikit-learn
      - name: Which leagues
        id: which
        # NFL on its three crons; college on its own three plus Thursday.
        run: |
          s="${{ github.event.schedule }}"
          l="${{ inputs.league || 'both' }}"
          nfl=false; cfb=false
          case "$s" in
            "") [ "$l" != cfb ] && nfl=true; [ "$l" != nfl ] && cfb=true ;;
            *" 4") nfl=true; cfb=true ;;
            *" 8-12,1 "*) cfb=true ;;
            *) nfl=true ;;
          esac
          echo "nfl=$nfl" >> "$GITHUB_OUTPUT"; echo "cfb=$cfb" >> "$GITHUB_OUTPUT"
      - name: Restore the published site from the picks branch
        # Everything, so a college-only run republishes the NFL page as it
        # was (and the other way round), with both bet histories.
        run: |
          mkdir -p site
          git fetch -q --depth 1 origin picks && \
            git archive FETCH_HEAD | tar -x -C site || true
      - name: Run picks
        if: steps.which.outputs.nfl == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          MY_BOOKS: ${{ vars.MY_BOOKS || 'draftkings,fanduel' }}
        run: |
          python picks.py --out site/index.html --json site/picks.json \
            --md site/README.md --history site/history.json --paper site/paper.json --bankroll "${{ inputs.bankroll || '1000' }}"
          cat site/README.md >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ inputs.test_alert }}" = "true" ] && [ ! -f alert.md ]; then
            printf '**Test alert.** New bets will show up like this.\n\n' > alert.md
            cat site/README.md >> alert.md
          fi
      - name: Run college picks
        if: steps.which.outputs.cfb == 'true'
        # Never blocks the NFL page from publishing.
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          MY_BOOKS: ${{ vars.MY_BOOKS || 'draftkings,fanduel' }}
        run: |
          python cfb_picks.py --out site/cfb/index.html --json site/cfb/picks.json \
            --history site/cfb/history.json --bankroll "${{ inputs.bankroll || '1000' }}"
      - name: Publish to the picks branch
        run: |
          cd site
          git init -q -b picks
          git config user.name "picks-bot"
          git config user.email "picks-bot@users.noreply.github.com"
          git add -A
          git commit -qm "Picks $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" picks
      - name: Notify about new bets
        # A comment on the open "Picks alerts" issue, mentioning the repo
        # owner, so GitHub pushes it to their phone.
        if: hashFiles('alert.md') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh issue list --state open --search "Picks alerts in:title" \
                --json number -q '.[0].number')
          if [ -z "$n" ]; then
            n=$(gh issue create --title "Picks alerts" --body \
                  "Each picks run comments here when it finds new bets." \
                  | grep -o '[0-9]*$')
          fi
          { cat alert.md; echo; echo "@${{ github.repository_owner }}"; } \
            > alert_body.md
          gh issue comment "$n" --body-file alert_body.md
      - uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: site
      - uses: actions/deploy-pages@v4
        continue-on-error: true
