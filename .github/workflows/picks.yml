name: Picks

# Runs the pick engine (picks.py) against live odds and publishes the result
# a few ways:
#   * the run's summary page (Actions tab -> latest "Picks" run)
#   * the `picks` branch: README.md renders on github.com on any phone,
#     https://github.com/bviolino93/NFL-model/tree/picks
#   * the dashboard on GitHub Pages, once enabled (Settings -> Pages ->
#     Source: GitHub Actions): https://bviolino93.github.io/NFL-model/
#
# history.json on the picks branch keeps every bet and grades it from
# nflverse final scores; each run reads it back and adds to it.
#
# Needs repository secret ODDS_API_KEY. Optional repository variable
# MY_BOOKS to change which books bets are placed at (default
# "draftkings,fanduel"; every book still informs the fair line).
# Each run costs ~6 Odds API credits (us + eu regions, 3 markets).
#
# Optional secret ANTHROPIC_API_KEY (the same key the college picks use):
# the handicapper (nfl_handicap.py) reviews every bet's matchup and makes
# small picks of its own, ~2 cents a review, stopping at $8 a month.
# Without it bets go out unreviewed.

on:
  schedule:
    # GitHub runs schedules best-effort: starts can be hours late (the 15:00
    # run on 2026-10-25 began at 18:13, Monday 20:00 on 2026-10-26 at
    # 23:35) or dropped outright (Thursday 19:00 on 2026-10-29 never
    # started). It's worst at the top of the hour, when everyone's cron
    # fires, so these sit at odd minutes, and every game day gets two runs.
    # Extra runs are safe: the ledger keeps one entry per bet and only new
    # bets alert.
    - cron: "37 12 * 9-12,1-2 0"   # Sunday 12:37 UTC
    - cron: "43 14 * 9-12,1-2 0"   # Sunday 14:43 UTC, before the early games
    - cron: "17 15 * 9-12,1-2 4"   # Thursday 15:17 UTC
    - cron: "47 18 * 9-12,1-2 4"   # Thursday 18:47 UTC
    - cron: "17 16 * 9-12,1-2 1"   # Monday 16:17 UTC
    - cron: "47 19 * 9-12,1-2 1"   # Monday 19:47 UTC
  workflow_dispatch:
    inputs:
      bankroll:
        description: "Bankroll for stake sizing"
        default: "1000"
      test_alert:
        description: "Send an alert even if no bets are new"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: picks
  cancel-in-progress: false

jobs:
  picks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache nflverse
        uses: actions/cache@v4
        with:
          path: .cache_nflverse
          key: nflverse-picks-${{ github.run_id }}
          restore-keys: nflverse-picks-
      - run: pip install pandas numpy pyarrow requests anthropic
      - name: Restore bet history from the picks branch
        run: |
          mkdir -p site
          git fetch -q --depth 1 origin picks && \
            git show FETCH_HEAD:history.json > site/history.json || true
          git show FETCH_HEAD:paper.json > site/paper.json 2>/dev/null || true
          git show FETCH_HEAD:handicap.json > site/handicap.json 2>/dev/null || true
      - name: Run picks
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MY_BOOKS: ${{ vars.MY_BOOKS || 'draftkings,fanduel' }}
        run: |
          python picks.py --out site/index.html --json site/picks.json \
            --md site/README.md --history site/history.json --paper site/paper.json --bankroll "${{ inputs.bankroll || '1000' }}"
          cat site/README.md >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ inputs.test_alert }}" = "true" ] && [ ! -f alert.md ]; then
            printf '**Test alert.** New bets will show up like this.\n\n' > alert.md
            cat site/README.md >> alert.md
          fi
      - name: Publish to the picks branch
        run: |
          cd site
          git init -q -b picks
          git config user.name "picks-bot"
          git config user.email "picks-bot@users.noreply.github.com"
          git add -A
          git commit -qm "Picks $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" picks
      - name: Notify about new bets
        # A comment on the open "Picks alerts" issue, mentioning the repo
        # owner, so GitHub pushes it to their phone.
        if: hashFiles('alert.md') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh issue list --state open --search "Picks alerts in:title" \
                --json number -q '.[0].number')
          if [ -z "$n" ]; then
            n=$(gh issue create --title "Picks alerts" --body \
                  "Each picks run comments here when it finds new bets." \
                  | grep -o '[0-9]*$')
          fi
          { cat alert.md; echo; echo "@${{ github.repository_owner }}"; } \
            > alert_body.md
          gh issue comment "$n" --body-file alert_body.md
      - uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: site
      - uses: actions/deploy-pages@v4
        continue-on-error: true
