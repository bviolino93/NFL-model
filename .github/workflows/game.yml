name: Check one game

# Runs a single game through the model (game.py) against live odds:
# the model's spread and total, the best DraftKings/FanDuel price for each
# side, and whether any of it is a bet. On a phone: GitHub app -> this repo
# -> Actions -> "Check one game" -> Run workflow, type a team.
#
# Or from the "Check a game" box on the Fieldline page
# (https://bviolino93.github.io/CFB-model/share/): it opens an issue titled
# "Check: <team>", and submitting it starts this run. Only the repo owner's
# issues count.
#
# The report lands on the run's summary page and as a comment on that issue
# (or the "Picks alerts" issue for a manual run), so it pushes to your
# phone, and in checks.json on the `checks` branch, which the Fieldline
# page shows. It doesn't place or log bets; the scheduled Picks runs still
# do that. ~6 Odds API credits a run.

on:
  workflow_dispatch:
    inputs:
      game:
        description: "Team or matchup, e.g. Chiefs, or KC SEA"
        required: true
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: game-check
  cancel-in-progress: false

jobs:
  game:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.event.issue.title, 'check:') &&
       github.event.issue.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache nflverse
        uses: actions/cache@v4
        with:
          path: .cache_nflverse
          key: nflverse-game-${{ github.run_id }}
          restore-keys: |
            nflverse-picks-
            nflverse-game-
      - run: pip install pandas numpy pyarrow requests
      - name: Which game
        id: q
        env:
          INPUT: ${{ inputs.game }}
          TITLE: ${{ github.event.issue.title }}
        run: |
          if [ -n "$INPUT" ]; then q="$INPUT"; else q="${TITLE#*:}"; fi
          q=$(printf '%s' "$q" | tr -d '\r\n' | sed 's/^ *//; s/ *$//')
          echo "game=$q" >> "$GITHUB_OUTPUT"
      - name: Restore earlier checks
        run: |
          git fetch -q --depth 1 origin checks && \
            git show FETCH_HEAD:checks.json > checks.json 2>/dev/null || true
      - name: Run the game
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          MY_BOOKS: ${{ vars.MY_BOOKS || 'draftkings,fanduel' }}
          GAME: ${{ steps.q.outputs.game }}
        run: |
          python game.py "$GAME" --md game.md --checks checks.json \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          cat game.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish to the checks branch
        run: |
          mkdir out && cp checks.json out/ && cd out
          git init -q -b checks
          git config user.name "picks-bot"
          git config user.email "picks-bot@users.noreply.github.com"
          git add -A
          git commit -qm "Check $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" checks
      - name: Reply on the issue
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --body-file game.md
            gh issue close "$ISSUE"
            exit 0
          fi
          n=$(gh issue list --state open --search "Picks alerts in:title" \
                --json number -q '.[0].number')
          [ -n "$n" ] || exit 0
          { cat game.md; echo; echo "@${{ github.repository_owner }}"; } \
            > game_body.md
          gh issue comment "$n" --body-file game_body.md
      - name: Say so on the issue if it failed
        if: failure() && github.event.issue.number
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body \
            "The check didn't finish. Details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
